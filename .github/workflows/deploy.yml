name: Deploy Luminosoft Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions for GitHub Pages and branch deployment
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite Production Assets
        env:
          VITE_SUPABASE_URL: https://pixvgshevennznzgdwro.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_pixvgshevennznzgdwro_placeholder' }}
          VITE_APP_NAME: Luminosoft
          VITE_APP_URL: https://luminosoft.in
        run: |
          npm run build
          cp dist/index.html dist/404.html
          echo "luminosoft.in" > dist/CNAME

      # Deploy Method 1: Push compiled production dist to gh-pages branch
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: luminosoft.in
          keep_files: false

      # Deploy Method 2: Official GitHub Pages Actions deployment
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
